<style>
/* Layout: una sola columna tipo "tocadiscos" — cabecera con marcador, disco misterioso y línea de tiempo vertical con huecos donde soltar la canción. Tema oscuro único, a propósito: luz de discoteca. */
:root {
  color-scheme: dark;
  --bg: #15102a;
  --bg-2: #1f1838;
  --card: #2a2148;
  --line: #3d3363;
  --fg: #f3edff;
  --muted: #a99fcb;
  --gold: #ffc23d;
  --pink: #ff5d8f;
  --teal: #3de0c5;
  --bad: #ff6b5b;
  --f-display: "Shrikhand", "Georgia", serif;
  --f-body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { min-height: 100%; overflow-x: hidden; }
body {
  background: var(--bg);
  background-image: radial-gradient(circle at 15% -10%, rgba(255,93,143,.22), transparent 45%),
                    radial-gradient(circle at 110% 20%, rgba(61,224,197,.14), transparent 40%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.45;
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 60px;
  display: flex; flex-direction: column; gap: 20px;
}
h1, h2 { font-family: var(--f-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .5px; }
h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1; color: var(--gold); text-shadow: 3px 3px 0 var(--pink); }
h2 { font-size: 1.6rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 700; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

.btn {
  border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 700;
  background: var(--gold); color: #251a00; font-size: 1.05rem;
  box-shadow: 0 4px 0 #b88600; transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b88600; }
.btn.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--line); }
.btn.small { padding: 8px 14px; font-size: .9rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* ---------- Setup ---------- */
.hero { display: flex; gap: 16px; align-items: center; }
.hero .vinyl { flex: none; width: 92px; height: 92px; }
.intro { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.panel { background: var(--bg-2); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.players { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; gap: 8px; align-items: center; }
.prow .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.prow input { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.prow button { background: none; border: 0; color: var(--muted); font-size: 1.3rem; width: 36px; height: 36px; border-radius: 8px; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.opts label { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.opts select { width: 100%; min-width: 0; max-width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 16px; text-overflow: ellipsis; }
.panel { min-width: 0; }
.rules { display: flex; flex-direction: column; gap: 8px; margin: 0; padding-left: 20px; color: var(--muted); }
.rules b { color: var(--fg); }

/* ---------- Juego ---------- */
.score { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
button.chip { color: var(--fg); font: inherit; font-size: .9rem; cursor: pointer; }
.chip { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); font-size: .9rem; }
.chip.on { border-color: var(--gold); background: var(--card); }
.chip .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #15102a; font-size: .8rem; }
.chip .n { font-family: var(--f-mono); font-weight: 800; }
.chip .tk { color: var(--gold); font-size: .8rem; }

.turn { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.turn h2 span { color: var(--pink); }

.mystery {
  position: relative; border-radius: 22px; padding: 20px; overflow: hidden;
  background: linear-gradient(135deg, var(--pink), #8c3cff);
  display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center;
  box-shadow: 0 12px 30px -12px rgba(255,93,143,.6);
}
.mystery .vinyl { width: 96px; height: 96px; }
.mystery.spin .vinyl { animation: spin 2.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.mystery .t { font-size: 1.3rem; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.mystery .a { opacity: .9; }
.mystery .q { font-family: var(--f-mono); font-weight: 800; font-size: 1.8rem; letter-spacing: .1em; }
.mystery .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.listen { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.listen a { color: #fff; background: rgba(0,0,0,.25); padding: 6px 12px; border-radius: 999px; text-decoration: none; font-size: .85rem; font-weight: 700; }
.listen a:hover { background: rgba(0,0,0,.4); }
.mystery.blind { min-height: 300px; }
.cover { position: absolute; inset: 0; background: linear-gradient(135deg, var(--pink), #8c3cff); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; z-index: 2; }
.cover .vinyl { width: 110px; height: 110px; }
.mystery.spin .cover .vinyl { animation: spin 2.2s linear infinite; }
.cover p { max-width: 30ch; }
.btn.play { background: #fff; color: #3a1260; box-shadow: 0 4px 0 rgba(0,0,0,.25); padding: 12px 22px; min-width: 170px; margin-top: 6px; }
.btn.play[disabled] { opacity: .8; }
.prog { height: 4px; width: 100%; max-width: 220px; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: #fff; transition: width .25s linear; }
.spbox { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; padding-top: 4px; border-top: 1px solid var(--line); }
.btn.sp { background: #1ed760; color: #04210f; box-shadow: 0 4px 0 #13994a; }
.linkish { background: none; border: 0; color: #fff; opacity: .8; text-decoration: underline; font-size: .85rem; }

.tl { display: flex; flex-direction: column; gap: 0; }
.tl .card {
  display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
}
.tl .card .y { font-family: var(--f-mono); font-weight: 800; font-size: 1.35rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.tl .card .s { min-width: 0; }
.tl .card .s b { display: block; overflow-wrap: anywhere; }
.tl .card .s small { color: var(--muted); }
.tl .card.new { animation: pop .5s ease; border-color: var(--teal); }
@keyframes pop { 0% { transform: scale(.8); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
.slot {
  margin: 6px 0; border: 2px dashed var(--line); border-radius: 12px; background: transparent;
  color: var(--muted); padding: 10px; font-weight: 700; font-size: .9rem; width: 100%;
  transition: background .15s, border-color .15s, color .15s;
}
.slot:hover, .slot.sel { border-color: var(--teal); color: var(--teal); background: rgba(61,224,197,.08); }
.slot.sel { border-style: solid; }
.tl.locked .slot { display: none; }

.bet { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bet input[type=number] { width: 100px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: var(--f-mono); font-weight: 800; }
.bet input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--gold); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions .btn { flex: 1 1 auto; }

.verdict { border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 4px; font-weight: 500; }
.verdict.ok { background: rgba(61,224,197,.14); border: 1px solid var(--teal); }
.verdict.no { background: rgba(255,107,91,.14); border: 1px solid var(--bad); animation: shake .4s; }
.verdict strong { font-family: var(--f-display); font-weight: 400; font-size: 1.5rem; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.handoff { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; }
.handoff .big { font-family: var(--f-display); font-size: clamp(2.4rem, 12vw, 3.4rem); line-height: 1.05; }

.win { text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; padding-top: 30px; }
.win .crown { font-family: var(--f-display); font-size: clamp(2.6rem, 12vw, 3.8rem); color: var(--gold); text-shadow: 3px 3px 0 var(--pink); line-height: 1.05; }
.rank { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.rank .chip { justify-content: space-between; padding: 10px 16px 10px 10px; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
footer { text-align: center; font-size: .8rem; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 480px) { .hero { flex-direction: column; align-items: flex-start; gap: 10px; } .hero .vinyl { width: 64px; height: 64px; } h1 { font-size: 10vw; } }
@media (max-width: 420px) { .opts { grid-template-columns: minmax(0, 1fr); } .mystery { grid-template-columns: 72px 1fr; } .mystery .vinyl { width: 72px; height: 72px; } }
</style>

function sortedCards(p) { return p.cards.slice().sort((a, b) => byId(a).y - byId(b).y); }

function place() {
  const p = S.players[S.turn];
  const tl = sortedCards(p);
  const song = byId(S.current);
  const lo = S.slot === 0 ? -Infinity : byId(tl[S.slot - 1]).y;
  const hi = S.slot === tl.length ? Infinity : byId(tl[S.slot]).y;
  const ok = song.y >= lo && song.y <= hi;
  let bonus = false;
  if (ok) p.cards.push(S.current);
  if (S.bet && Number(S.betYear) === song.y) { p.tokens++; bonus = true; }
  S.result = { ok, bonus, id: S.current };
  S.screen = "result";
  save(); render();
  if (ok) confetti(bonus ? 220 : 120);
}

function skip() {
  const p = S.players[S.turn];
  if (p.tokens < 1 || !S.deck.length) return;
  p.tokens--; S.current = S.deck.pop(); S.slot = null; S.revealed = S.mode === "abierto";
  save(); render(); startSong(S.current);
}

function next() {
  stopSong();
  const p = S.players[S.turn];
  if (p.cards.length >= S.goal) { S.screen = "win"; S.winner = S.turn; save(); render(); confetti(400); return; }
  if (!S.deck.length) S.deck = shuffle(pool().filter(id => !S.players.some(pl => pl.cards.includes(id))));

  S.current = S.deck.pop(); S.slot = null; S.bet = false; S.result = null; S.revealed = S.mode === "abierto";

}

    </div>` : ""}
    <button class="btn" id="start">Empezar el carrete</button>
  </section>
  <section class="panel">
    <span class="label">Cómo se juega</span>
    <ol class="rules">
      <li>Cada jugador empieza con <b>una canción con su año</b> en su línea de tiempo.</li>
      <li>En tu turno suena un disco misterioso (30 segundos). En modo <b>a ciegas</b> solo lo escuchas: el título aparece al final.</li>
      <li>Toca el hueco donde crees que va: <b>antes, entre o después</b> de tus canciones.</li>
      <li>Si aciertas, la carta se queda. Si fallas, se va a la basura.</li>
      <li>Apuesta el <b>año exacto</b> y, si lo clavas, ganas una ficha ●. Gasta fichas para cambiar una canción que no conoces.</li>
      <li>Gana quien llegue primero a la meta.</li>
    </ol>
  </section>
  <footer>${pool().length} cartas en este mazo · ${SONGS.filter(s => s.cl && !s.tv).length} canciones chilenas · ${SONGS.filter(s => s.tv).length} teleseries</footer>`;
  app.querySelectorAll(".prow input").forEach((inp, i) => inp.addEventListener("input", e => { S.names[i] = e.target.value; save(); }));
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (S.names.length > 1) { S.names.splice(+b.dataset.del, 1); save(); render(); } });
  const add = document.getElementById("add");
  if (add) add.onclick = () => { S.names.push(""); save(); render(); document.getElementById("p" + (S.names.length - 1)).focus(); };
  document.getElementById("goal").onchange = e => { S.goal = +e.target.value; save(); };
  document.getElementById("mode").onchange = e => { S.mode = e.target.value; save(); };
  document.getElementById("mazo").onchange = e => { S.mazo = e.target.value; save(); render(); };
  document.getElementById("start").onclick = newGame;
  const spIn = document.getElementById("spIn"), spOut = document.getElementById("spOut");
  if (spIn) spIn.onclick = spLogin;
  if (spOut) spOut.onclick = () => { SPT = null; spSave(); spMsg = ""; render(); };
}

function renderHandoff() {
  const p = S.players[S.turn];
  app.innerHTML = `${scoreboard()}
  <div class="handoff">
    <span class="label">Pásale el teléfono a</span>
    <div class="big" style="color:${p.color}">${esc(p.name)}</div>
    <p class="muted">${p.cards.length} de ${S.goal} canciones · ${p.tokens} fichas</p>
    <button class="btn" id="go">Estoy listo</button>
  </div>`;
  getPreview(S.current);
  document.getElementById("go").onclick = () => { S.screen = "play"; S.editing = null; save(); render(); startSong(S.current); };
  wireScore();
}

function renderPlay() {
  const p = S.players[S.turn];
  const song = byId(S.current);
  const res = S.screen === "result" ? S.result : null;
  const tl = sortedCards(p);
  const listen = `<div class="listen"><a href="${yt(song)}" target="_blank" rel="noopener">YouTube</a><a href="${sp(song)}" target="_blank" rel="noopener">Spotify</a></div>`;
  const playBtn = `<button class="btn play" id="playBtn" type="button">▶ Escuchar</button><div class="prog" aria-hidden="true"><i id="progBar"></i></div>`;
  const blind = !S.revealed && !res && !song.tv;
  const tvBtn = `<a class="btn play" href="${yt(song)}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">▶ Ver la cortina</a>`;
  const cover = blind ? `<div class="cover">
      ${VINYL(p.color)}
      <p><b>¿De qué año es?</b> Escucha y colócala en tu línea. El título aparece al final.</p>
      ${playBtn}
      ${spOn() ? `<small id="spMsg" style="opacity:.9">${esc(spMsg)}</small>` : ""}
      <button class="linkish" id="reveal" type="button">Me rindo: mostrar título</button>
    </div>` : "";
  let tlHtml = "";
  tl.forEach((id, i) => {
    tlHtml += `<button class="slot ${S.slot === i ? "sel" : ""}" data-slot="${i}">${i === 0 ? "Antes de " + byId(id).y : "Entre " + byId(tl[i - 1]).y + " y " + byId(id).y}</button>`;
    const c = byId(id);
    tlHtml += `<div class="card ${res && res.ok && id === res.id ? "new" : ""}"><span class="y">${c.y}</span><span class="s"><b>${esc(c.t)}</b><small>${esc(c.a)}</small></span></div>`;
  });
  tlHtml += `<button class="slot ${S.slot === tl.length ? "sel" : ""}" data-slot="${tl.length}">Después de ${byId(tl[tl.length - 1]).y}</button>`;

  app.innerHTML = `${scoreboard()}
  <div class="turn"><h2>Turno de <span style="color:${p.color}">${esc(p.name)}</span></h2><span class="muted">${S.deck.length} discos en la pila</span></div>
  <section class="mystery ${blind ? "blind" : ""}" aria-live="polite">
    ${VINYL(p.color)}
    <div class="info">
      <span class="q">${res ? song.y : "¿ ? ? ? ?"}</span>
      ${song.tv ? `<span class="label" style="color:#fff">Teleserie chilena</span>` : ""}
      <span class="t">${esc(song.t)}</span>${song.cl && !song.tv ? `<span class="label" style="color:#fff">Hecho en Chile</span>` : ""}
      <span class="a">${esc(song.a)}</span>
      ${song.tv ? playBtn + tvBtn.replace('class="btn play"', 'class="btn ghost small"').replace("▶ Ver la cortina", "Buscar el video de la cortina") : blind ? "" : playBtn}
      ${song.tv ? "" : listen}
      ${spOn() && !blind ? `<small id="spMsg" style="opacity:.85">${esc(spMsg)}</small>` : ""}
    </div>
    ${cover}
  </section>
  ${res ? `<div class="verdict ${res.ok ? "ok" : "no"}">
      <strong>${res.ok ? "¡Bacán, la achuntaste!" : "Nooo, le erraste"}</strong>
      <span>${res.ok ? "La canción se queda en tu línea de tiempo." : `Era de ${song.y}. Esta carta se descarta.`}</span>
      ${S.bet ? `<span>${res.bonus ? "Clavaste el año exacto: +1 ficha ●" : `Apostaste ${esc(S.betYear)}, no era.`}</span>` : ""}
    </div>
    <button class="btn" id="next">${p.cards.length >= S.goal ? "Ver ganador" : "Siguiente turno"}</button>` : `
    <div class="bet">
      <input type="checkbox" id="bet" ${S.bet ? "checked" : ""}><label for="bet">Apostar año exacto</label>
      <input type="number" id="betYear" min="1950" max="2030" value="${esc(S.betYear)}" ${S.bet ? "" : "disabled"} aria-label="Año">
    </div>
    <div class="actions">
      <button class="btn" id="place" ${S.slot === null ? "disabled" : ""}>${S.slot === null ? "Elige un hueco abajo" : "Colocar aquí"}</button>
      <button class="btn ghost" id="skip" ${p.tokens < 1 ? "disabled" : ""}>Cambiar (● 1)</button>
    </div>`}
  <span class="label">Tu línea de tiempo</span>
  <div class="tl ${res ? "locked" : ""}">${tlHtml}</div>
  <button class="btn ghost small" id="quit">Terminar partida</button>`;

  app.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => { S.slot = +b.dataset.slot; save(); render(); document.getElementById("place")?.scrollIntoView({ block: "center", behavior: "smooth" }); });
  const on = (id, ev, fn) => { const el = document.getElementById(id); if (el) el[ev] = fn; };
  on("place", "onclick", place);
  on("skip", "onclick", skip);
  on("next", "onclick", next);
  on("reveal", "onclick", () => { S.revealed = true; save(); render(); });
  on("playBtn", "onclick", toggleSong);
  paintPlayer();
  if (!previews[S.current]) getPreview(S.current).then(() => { if (player === "idle") paintPlayer(); });
  on("bet", "onchange", e => { S.bet = e.target.checked; save(); render(); });
  on("betYear", "oninput", e => { S.betYear = e.target.value; save(); });
  on("quit", "onclick", () => { S.screen = "setup"; save(); render(); });
  wireScore();
}

function renderWin() {
  const w = S.players[S.winner];
  const rank = S.players.map((p, i) => ({ ...p, i })).sort((a, b) => b.cards.length - a.cards.length || b.tokens - a.tokens);
  app.innerHTML = `<div class="win">
    ${VINYL(w.color)}
    <span class="label">¡La raja! Rey de la pista</span>
    <div class="crown">${esc(w.name)}</div>
    <p class="muted">Completó ${S.goal} canciones en orden.</p>
    <div class="rank">${rank.map((p, k) => `<div class="chip ${p.i === S.winner ? "on" : ""}"><span style="display:flex;gap:8px;align-items:center"><span class="av" style="background:${p.color}">${k + 1}</span>${esc(p.name)}</span><span class="n">${p.cards.length} · ● ${p.tokens}</span></div>`).join("")}</div>
    <div class="actions" style="width:100%"><button class="btn" id="again">Revancha</button><button class="btn ghost" id="menu">Cambiar jugadores</button></div>
  </div>`;
  document.getElementById("again").onclick = newGame;
  document.getElementById("menu").onclick = () => { S.screen = "setup"; save(); render(); };
}

// Confeti
const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let parts = [], raf = null;
function confetti(n) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4, r: Math.random() * 6 + 3, c: COLORS[i % COLORS.length], a: Math.random() * 6, life: 120 });
  if (!raf) tick();
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.vx *= .99; p.a += .2; p.life--; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c; cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); cx.restore(); });
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), null);
}

render();
spHandleRedirect();
</script>
